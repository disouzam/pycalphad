[cosmic-ray]
module-path = "pycalphad"
timeout = 30.0
excluded-modules = []
test-command = "uv run python -m pytest tests"

[cosmic-ray.distributor]
name = "http"

[cosmic-ray.distributor.http]
worker-urls = [
    "http://localhost:9001",
    "http://localhost:9002"
    "http://localhost:9003"
    "http://localhost:9004"
    "http://localhost:9006"
    "http://localhost:9006"
    "http://localhost:9007"
    "http://localhost:9008"
    "http://localhost:9009"
    "http://localhost:9010"
]